<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>허니서브 점수판</title>
<style>
*{box-sizing:border-box}body{margin:0;background:transparent;font:600 24px system-ui,sans-serif;color:#fff;letter-spacing:0}.board{width:600px;max-width:100%;padding:12px}.row{display:grid;grid-template-columns:34px minmax(0,1fr) 70px;align-items:center;min-height:66px;background:rgba(17,38,29,.88);border-left:6px solid #39b986;padding:8px 12px}.row+.row{border-left-color:#f196a4;border-top:1px solid #fff5}.names{font-size:22px;overflow-wrap:anywhere}.score{text-align:center;font-size:40px;font-variant-numeric:tabular-nums}.status{font-size:14px;background:#14251de6;padding:6px 12px;min-height:30px}.serve{color:#e9dd84}.stale{color:#ffd1a7}
</style></head><body><div class="board"><div class="row"><span id="serveA" class="serve"></span><span id="namesA" class="names">A팀</span><strong id="scoreA" class="score">0</strong></div><div class="row"><span id="serveB" class="serve"></span><span id="namesB" class="names">B팀</span><strong id="scoreB" class="score">0</strong></div><div id="status" class="status">점수판 연결 중</div></div><script type="module" src="./overlay.js"></script></body></html>
