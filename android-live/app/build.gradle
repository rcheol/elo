plugins { id 'com.android.application' }

android {
    namespace 'chat.honeyserve.live'
    compileSdk 35
    defaultConfig {
        applicationId 'chat.honeyserve.live'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
    }
    buildTypes { debug { applicationIdSuffix '.debug' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
