name: Android Live APK
on:
  push:
    branches: [main]
    paths: ['android-live/**', '.github/workflows/android-live.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build test APK
        working-directory: android-live
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: honeyserve-live-test-apk
          path: android-live/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
