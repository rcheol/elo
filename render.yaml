services:
  - type: web
    name: honeyserve-elo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node --experimental-sqlite server.js
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATABASE_URL
        sync: false
